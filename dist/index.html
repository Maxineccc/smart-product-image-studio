<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff5a1f" />
  <meta name="description" content="上传商品截图，自动识别商品名、价格和商品图，导出白底800×800商品营销图。" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5a1f'/%3E%3Cpath d='M17 17h30v30H17z' fill='white' opacity='.96'/%3E%3Ccircle cx='25' cy='25' r='4' fill='%23ff5a1f'/%3E%3Cpath d='M20 42l9-10 7 7 5-6 4 9z' fill='%23ff5a1f'/%3E%3C/svg%3E" />
  <title>智能商品图生成器</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">图</span><div><strong>智能商品图生成器</strong><small>截图识别 · 白底模板 · 800×800导出</small></div></div>
    <div class="status-pill" id="globalStatus"><i></i> 本地处理，不上传原图</div>
  </header>

  <main class="workspace">
    <section class="panel controls" aria-label="商品设置">
      <div class="panel-head"><div><span class="step">01</span><h1>上传商品截图</h1></div><span class="privacy">图片仅在浏览器处理</span></div>
      <label class="dropzone" id="dropzone" for="fileInput">
        <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple />
        <span class="upload-icon">↑</span>
        <strong>拖入截图，或点击批量选择</strong>
        <small>支持一次上传多张；自动选取文字、主图并高清润色</small>
      </label>

      <div class="batch-card" id="batchCard" hidden>
        <div class="batch-head"><div><strong>批量任务</strong><span id="batchCount">0 张</span></div><button class="secondary" id="parseAllBtn" type="button">一键解析并优化全部</button></div>
        <div class="batch-list" id="batchList"></div>
      </div>

      <div class="source-wrap" id="sourceWrap" hidden>
        <div class="source-toolbar"><span><i class="legend orange"></i>商品图 <i class="legend purple"></i>商品名称</span><button class="text-btn" id="autoCropBtn" type="button">重新智能框选</button></div>
        <div class="crop-stage" id="cropStage"><img id="sourceImage" alt="上传的商品截图" /><div id="cropBox" class="crop-box" tabindex="0" aria-label="商品区域选择框"><b class="handle br"></b></div><div id="nameCropBox" class="crop-box name-crop-box" tabindex="0" aria-label="商品名称选择框"><b class="handle br"></b></div></div>
        <div class="parse-row"><button class="secondary" id="parseBtn" type="button">智能解析当前图</button><span id="parseStatus">高清润色已启用</span></div>
      </div>

      <div class="section-title"><span class="step">02</span><h2>校正识别结果</h2></div>
      <div class="form-grid">
        <label class="wide">产品名称<input id="productName" value="抹茶丝绒拿铁" maxlength="16" /></label>
        <label>产品价格<input id="productPrice" type="number" value="23.1" min="0" step="0.01" /></label>
        <label>红包金额<input id="redEnvelope" type="number" value="20" min="0" step="1" /></label>
        <label>新人最高红包<input id="newUserMax" type="number" value="20" min="0" step="1" /></label>
        <label>打包费<input id="packingFee" type="number" value="1" min="0" step="1" /></label>
        <label>配送费<input id="deliveryFee" type="number" value="0" min="0" step="1" /></label>
        <label>配送立减<input id="deliveryDiscount" type="number" value="3" min="0" step="1" /></label>
        <label>到手价<input id="finalPrice" type="number" value="0.01" min="0" step="0.01" /></label>
      </div>
      <label class="switch-row"><input id="whiteBg" type="checkbox" checked /><span></span><b>强制纯白背景</b></label>
    </section>

    <section class="panel preview-panel" aria-label="导出预览">
      <div class="panel-head"><div><span class="step">03</span><h2>实时预览</h2></div><span class="size-chip">800 × 800</span></div>
      <div class="canvas-shell"><canvas id="outputCanvas" width="800" height="800" aria-label="商品营销图预览"></canvas></div>
      <div class="export-row">
        <div><strong id="exportMeta">800×800 · 预计小于400 KB</strong><small>JPG，白色补边，不裁切文字</small></div>
        <button class="primary" id="downloadBtn" type="button">下载成品图</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4/dist/tf.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@upscalerjs/default-model@latest/dist/umd/index.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/upscaler@latest/dist/browser/umd/upscaler.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
