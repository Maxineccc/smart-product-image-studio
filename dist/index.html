<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ff5a1f" />
  <meta name="description" content="支持方形与横版商品模板、透明PNG原图图层、品牌文字和主体位置编辑。" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5a1f'/%3E%3Cpath d='M17 17h30v30H17z' fill='white' opacity='.96'/%3E%3Ccircle cx='25' cy='25' r='4' fill='%23ff5a1f'/%3E%3Cpath d='M20 42l9-10 7 7 5-6 4 9z' fill='%23ff5a1f'/%3E%3C/svg%3E" />
  <title>智能商品图生成器</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="./styles.css?v=17" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">图</span><div><strong>智能商品图生成器 <em class="version-badge">v2.1.1</em></strong><small>双模板排版 · 豆包纯色底去除 · 本地导出</small></div></div>
    <div class="status-pill" id="globalStatus"><i></i> 本地处理，不上传原图</div>
  </header>

  <main class="workspace">
    <section class="panel controls" aria-label="商品设置">
      <div class="template-card">
        <label>选择模板<select id="templateSelect"><option value="square">方形结算单 · 800×800</option><option value="cafe">横版咖啡闪购 · 1280×720</option></select></label>
        <small id="templateHint">适合费用明细与到手价展示</small>
      </div>

      <div class="direct-card">
        <div><strong>商品主体图层</strong><small>真透明图直接载入；豆包图片请使用纯品红底模式自动转透明</small></div>
        <div class="direct-actions"><label class="secondary direct-upload" for="subjectInput">上传透明主体<input id="subjectInput" type="file" accept="image/png,image/webp" /></label><label class="secondary direct-upload chroma-upload" for="chromaInput">上传豆包纯色底图<input id="chromaInput" type="file" accept="image/png,image/jpeg,image/webp" /></label><button class="text-btn" id="copyChromaPrompt" type="button">复制豆包纯色底话术</button></div>
        <span id="subjectStatus">未上传 · 豆包建议使用纯品红色 #FF00FF 背景</span>
      </div>

      <div class="panel-head"><div><span class="step">01</span><h1>上传商品截图</h1></div><span class="privacy">图片仅在浏览器处理</span></div>
      <label class="dropzone" id="dropzone" for="fileInput">
        <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple />
        <span class="upload-icon">↑</span>
        <strong>拖入截图，或点击批量选择</strong>
        <small>支持一次上传多张；自动选取文字、主图并生成透明立体主体</small>
      </label>

      <div class="batch-card" id="batchCard" hidden>
        <div class="batch-head"><div><strong>批量任务</strong><span id="batchCount">0 张</span></div><button class="secondary" id="parseAllBtn" type="button">一键解析并优化全部</button></div>
        <div class="batch-list" id="batchList"></div>
      </div>

      <div class="source-wrap" id="sourceWrap" hidden>
        <div class="source-toolbar"><span><i class="legend orange"></i>商品图 <i class="legend purple"></i>商品名称</span><button class="text-btn" id="autoCropBtn" type="button">重新智能框选</button></div>
        <div class="crop-stage" id="cropStage"><img id="sourceImage" alt="上传的商品截图" /><div id="cropBox" class="crop-box" tabindex="0" aria-label="商品区域选择框"><b class="handle br"></b></div><div id="nameCropBox" class="crop-box name-crop-box" tabindex="0" aria-label="商品名称选择框"><b class="handle br"></b></div></div>
        <div class="mode-row"><label>处理模型<select id="qualityMode"><option value="u2net" selected>稳定抠图（推荐）</option><option value="detail">精细立体抠图</option><option value="fast">轻量快速抠图</option></select></label><small>精细模式会清理圆底、保留原始像素并增强清晰度与立体光影</small></div>
        <div class="parse-row"><button class="secondary" id="parseBtn" type="button">智能解析当前图</button><span id="parseStatus">轻量AI将提前缓存</span></div>
      </div>

      <div class="section-title"><span class="step">02</span><h2>校正识别结果</h2></div>
      <div class="form-grid">
        <label class="wide landscape-only" hidden>品牌名称<input id="brandName" value="星巴克" maxlength="10" /></label>
        <label class="wide square-only">产品名称<input id="productName" value="抹茶丝绒拿铁" maxlength="16" /></label>
        <label class="square-only">产品价格<input id="productPrice" type="number" value="23.1" min="0" step="0.01" /></label>
        <label class="square-only">红包金额<input id="redEnvelope" type="number" value="20" min="0" step="1" /></label>
        <label class="square-only">新人最高红包<input id="newUserMax" type="number" value="20" min="0" step="1" /></label>
        <label class="square-only">打包费<input id="packingFee" type="number" value="1" min="0" step="1" /></label>
        <label class="square-only">配送费<input id="deliveryFee" type="number" value="0" min="0" step="1" /></label>
        <label class="square-only">配送立减<input id="deliveryDiscount" type="number" value="3" min="0" step="1" /></label>
        <label class="square-only">到手价<input id="finalPrice" type="number" value="0.01" min="0" step="0.01" /></label>
      </div>
      <label class="switch-row square-only"><input id="whiteBg" type="checkbox" checked /><span></span><b>强制纯白背景</b></label>

      <div class="tune-card">
        <div class="tune-head"><div><span class="step">03</span><h2>主体位置微调</h2></div><button class="text-btn" id="resetPlacement" type="button">恢复居中</button></div>
        <label><span>主体大小 <output id="productScaleValue">100%</output></span><input id="productScale" type="range" min="30" max="180" value="100" step="1" /></label>
        <label><span>左右位置 <output id="productOffsetXValue">0</output></span><input id="productOffsetX" type="range" min="-260" max="260" value="0" step="1" /></label>
        <label><span>上下位置 <output id="productOffsetYValue">0</output></span><input id="productOffsetY" type="range" min="-180" max="160" value="0" step="1" /></label>
        <label><span>旋转角度 <output id="productRotationValue">0°</output></span><input id="productRotation" type="range" min="-30" max="30" value="0" step="1" /></label>
        <label><span>主体透明度 <output id="productOpacityValue">100%</output></span><input id="productOpacity" type="range" min="20" max="100" value="100" step="1" /></label>
        <div class="layer-switches"><label class="switch-row"><input id="productShadow" type="checkbox" checked /><span></span><b>自然投影</b></label><label class="switch-row"><input id="productFlip" type="checkbox" /><span></span><b>水平翻转</b></label></div>
      </div>
    </section>

    <section class="panel preview-panel" aria-label="导出预览">
      <div class="panel-head"><div><span class="step">04</span><h2>实时预览</h2></div><span class="size-chip" id="sizeChip">800 × 800</span></div>
      <div class="canvas-shell"><canvas id="outputCanvas" width="800" height="800" aria-label="商品营销图预览"></canvas></div>
      <div class="export-row">
        <div><strong id="exportMeta">800×800 · 预计小于400 KB</strong><small id="exportHint">JPG，白色补边，不裁切文字</small></div>
        <button class="primary" id="downloadBtn" type="button">下载成品图</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@bunnio/rembg-web@1.0.2/dist/index.umd.min.js" defer></script>
  <script src="./app.js?v=24" defer></script>
</body>
</html>
